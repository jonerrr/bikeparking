server {
    listen 8080;
    listen [::]:8080;
    root /usr/share/nginx/html;
    server_name _;

    location / {
        try_files $uri $uri.html $uri/ =404; # if we cannot find a match, route to 404.
    }

    error_page 404 /404.html; # if 404, route the request to 404.html.

    include /etc/nginx/mime.types; # handle mime.

    gzip_static on;
}